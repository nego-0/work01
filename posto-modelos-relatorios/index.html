<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posto Aduaneiro — Modelos e Relatórios</title>
  <style>
:root {
  --verde: #1a6b3c;
  --verde-claro: #e7f2ec;
  --cinza: #f4f5f6;
  --borda: #d4d8dc;
  --texto: #1c2126;
  --suave: #667085;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--texto);
  background: var(--cinza);
  line-height: 1.5;
}
header {
  background: var(--verde);
  color: #fff;
  padding: 16px 22px;
}
header h1 { margin: 0; font-size: 1.15rem; }
header p { margin: 4px 0 0; font-size: .82rem; opacity: .9; }
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  background: #14532b;
  padding: 0 12px;
}
nav button {
  background: none;
  border: none;
  color: #cfe6d8;
  padding: 11px 16px;
  font-size: .9rem;
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
nav button:hover { color: #fff; }
nav button.activo { color: #fff; border-bottom-color: #fff; font-weight: 600; }
main { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px; }
.painel { display: none; }
.painel.activo { display: block; }
.cartao {
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 18px;
}
.cartao h2 { margin: 0 0 4px; font-size: 1.02rem; }
.cartao h3 { margin: 18px 0 8px; font-size: .92rem; color: var(--verde); }
.cartao .ajuda { margin: 0 0 14px; color: var(--suave); font-size: .84rem; }
label { display: block; font-size: .8rem; color: var(--suave); margin: 0 0 3px; }
input, select, textarea {
  width: 100%;
  padding: 8px 9px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  font: inherit;
  background: #fff;
}
textarea { resize: vertical; min-height: 68px; }
.grelha { display: grid; gap: 12px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 1fr 1fr 1fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.campo { margin-bottom: 4px; }
@media (max-width: 640px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
button.acao {
  background: var(--verde);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 10px 18px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
}
button.acao:hover { background: #14532b; }
button.sec {
  background: #fff;
  color: var(--verde);
  border: 1px solid var(--verde);
  border-radius: 7px;
  padding: 8px 14px;
  font-size: .85rem;
  cursor: pointer;
}
button.ligereza {
  background: none; border: none; color: #b42318; cursor: pointer;
  font-size: .82rem; padding: 4px 6px;
}
.linha-botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.sub {
  border: 1px dashed var(--borda);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  background: #fafbfc;
  position: relative;
}
.sub .remover { position: absolute; top: 8px; right: 8px; }
table.lista { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.lista th, table.lista td {
  text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--borda);
}
table.lista th { color: var(--suave); font-weight: 600; }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 20px;
  font-size: .75rem; background: var(--verde-claro); color: var(--verde);
}
.vazio { color: var(--suave); font-style: italic; padding: 10px 0; }
.aviso {
  background: var(--verde-claro); border: 1px solid #bfe0cc;
  border-radius: 8px; padding: 10px 12px; font-size: .84rem; margin: 0 0 14px;
}

</style>
</head>
<body>
  <header>
    <h1>Posto Aduaneiro — Modelos e Relatórios</h1>
    <p>Preenchimento de modelos e produção automática de relatórios. Funciona sem
      Internet; os dados nunca saem deste computador.</p>
  </header>
  <nav id="nav"></nav>
  <main></main>

  // Linha "nada a assinalar" para tabelas vazias.
  function linhaVazia(ncol) {
    const c = [{ text: '-', align: 'center' }, { text: '0', align: 'center' }];
    while (c.length < ncol) c.push({ text: '----------', align: 'center' });
    return c;
  }

  // =========================================================================
  // TRB — Termo de Recepção de Bagagens (entregue à companhia aérea)
  // =========================================================================
  function termoRecepcao(inst, dados) {
    const { p, espaco, porExtenso, documento } = dx();
    const bags = dados.bagagens || [];
    const b = [];
    b.push(p(inst.postoCurto, { align: 'center', bold: true, after: 240, size: 11 }));
    b.push(p('TERMO DE RECEPÇÃO', { align: 'center', bold: true, size: 14, after: 240 }));

    const ref = bags[0] || {};
    const plural = bags.length > 1;
    const intro = plural
      ? `No âmbito das nossas actividades, foram retidas ${bags.length} bagagens com ` +
        `interesse aduaneiro, com os seguintes nomes e n.os de etiqueta:`
      : `No âmbito das nossas actividades, foi retida 1 bagagem com interesse ` +
        `aduaneiro, proveniente de ${ref.proveniencia || '—'}, do vôo ${ref.voo || '—'}, ` +
        `do dia ${porExtenso(ref.dataVoo) || '—'}, com o seguinte nome e n.º de etiqueta:`;
    b.push(p(intro, { align: 'both', after: 200 }));

    bags.forEach((bag) => {
      const linha = plural
        ? `${bag.passageiro || '—'} – ${bag.etiqueta || '—'}  (${bag.proveniencia || '—'}, ` +
          `vôo ${bag.voo || '—'}, ${porExtenso(bag.dataVoo) || '—'})`
        : `${bag.passageiro || '—'} – ${bag.etiqueta || '—'}`;
      b.push(p(linha, { align: 'center', bold: true, after: 200 }));
    });

    b.push(p('Por ser verdade, lavrou-se o presente termo de recepção que vai ' +
      'devidamente assinado pelos responsáveis das áreas.', { align: 'both', after: 240 }));

    b.push.apply(b, assinatura('O Chefe de Turno AGT', dados.chefeAgt || ''));
    b.push.apply(b, assinatura('O Chefe de Turno PFA', dados.chefePfa || ''));
    b.push.apply(b, assinatura('Pela Companhia Aérea', dados.companhia || ''));

    b.push(espaco(240));
    b.push(p(`${inst.cidade}, aos ${porExtenso(dados.dataTermo || (bags[0] && bags[0].dataVoo))}`,
      { align: 'left' }));

    return { nome: `TRB_${(ref.passageiro || 'bagagem').replace(/\s+/g, '_')}`, xml: documento(b) };
  }

  // =========================================================================
  // CKL — Check-list de materiais e equipamentos (fim de turno)
  // =========================================================================
  function checklist(inst, dados) {
    const { p, table, espaco, documento } = dx();
    const b = [];
    b.push.apply(b, vistoChefePosto(inst));
    b.push(p('CHECK-LIST | MATERIAIS E EQUIPAMENTOS DE SERVIÇO',
      { align: 'center', bold: true, size: 13, after: 200 }));
    b.push(p(`TURNO: ${dados.turno || ''}                                     ` +
      `DATA: ${dataCurta(dados.data)}`, { after: 200 }));

    const largs = [4200, 900, 1800, 2738];
    const linhas = [[
      { text: 'DESCRIÇÃO', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'QTD', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'ESTADO', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'OBSERVAÇÃO', bold: true, align: 'center', fill: 'D9D9D9' }
    ]];
    (dados.itens || []).forEach((it) => linhas.push([
      { text: it.descricao || '' },
      { text: it.qtd || '', align: 'center' },
      { text: it.estado || '', align: 'center' },
      { text: it.observacao || '' }
    ]));
    b.push(table(linhas, { widths: largs, header: 1 }));

    b.push(p([{ text: 'Ocorrência Diária: ', bold: true },
      { text: dados.ocorrencia || 'Sem ocorrências a assinalar.' }], { before: 120, after: 240 }));

    b.push.apply(b, assinatura('Ass. Chefe de Turno | entreguei:', dados.chefeEntrega || ''));
    b.push.apply(b, assinatura('Ass. Chefe de Turno | recebi:', dados.chefeRecebe || ''));
    return { nome: `CKL_Turno_${dados.turno || ''}_${dados.data || ''}`, xml: documento(b) };
  }

  // =========================================================================
  // RGA-24 — Relatório-síntese das últimas 24 h (gestão aeroportuária)
  // =========================================================================
  function relatorio24(inst, ag) {
    const { p, table, espaco, porExtenso, diaExtenso, documento } = dx();
    const ano = (ag.dia || '').slice(0, 4);
    const b = [];
    b.push.apply(b, vistoChefePosto(inst));
    b.push(p([{ text: 'Assunto: ', bold: true },
      { text: `Relatório Síntese das Apreensões realizadas no Período de ` +
        `${diaExtenso(ag.dia)} à ${diaExtenso(ag.diaSeguinte)} de ${ano}.`, bold: true }],
      { after: 200 }));
    b.push(p(`O ${inst.postoCurto}, vem por meio deste relatar as principais ocorrências ` +
      `registadas no período compreendido entre às 07h00 do dia ${diaExtenso(ag.dia)} até às ` +
      `07h00 do dia ${diaExtenso(ag.diaSeguinte)} do ano ${ano}, o seguinte:`,
      { align: 'both', after: 200 }));

    // Secção 1 — Valores
    b.push(p('Apreensão de Valores', { bold: true, after: 80 }));
    const hV = [[
      { text: 'N.º', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Passageiros Envolvidos', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Nacionalidade', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Destino', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'N.º do Voo', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Valor', bold: true, align: 'center', fill: 'D9D9D9' }
    ]];
    if (ag.valores.length) {
      ag.valores.forEach((a, i) => hV.push([
        { text: String(i + 1).padStart(2, '0'), align: 'center' },
        { text: a.passageiro || '' },
        { text: a.nacionalidade || '', align: 'center' },
        { text: a.origemDestino || '', align: 'center' },
        { text: a.voo || '', align: 'center' },
        { text: a.valor || '', align: 'center' }
      ]));
    } else { hV.push(linhaVazia(6)); }
    b.push(table(hV, { widths: [700, 2600, 1700, 1500, 1200, 1938], header: 1 }));
    b.push(p([{ text: 'Apreensão de Valores com maior Realce: ', bold: true },
      { text: ag.realces.length ? ag.realces.join('; ') : 'Nada a realçar.' }], { after: 160 }));

    // Secção 2 — Mercadoria sujeita a direitos
    b.push(p('Apreensão de Mercadoria Sujeita a Pagamento de Direitos', { bold: true, after: 80 }));
    b.push(seccaoMercadoria(inst, ag.mercadoria));
    b.push(p([{ text: 'Apreensão de Mercadorias com maior Realce: ', bold: true },
      { text: 'Nada a realçar.' }], { after: 160 }));

    // Secção 3 — Mercadoria proibida / restrita
    b.push(p('Apreensão de Mercadoria Proibida - Restrita', { bold: true, after: 80 }));
    b.push(seccaoMercadoria(inst, ag.proibida));
    b.push(p([{ text: 'Apreensão de Mercadorias com maior Realce: ', bold: true },
      { text: 'Nada a realçar.' }], { after: 200 }));

    b.push(p('Nada mais a relatar de momento, reiteramos cordiais saudações.',
      { align: 'both', after: 200 }));
    b.push(p(`${inst.cidade}, ${porExtenso(ag.diaSeguinte)}.`, { after: 200 }));
    b.push.apply(b, assinatura('O CHEFE DE TURNO', ag.chefeTurno || '', 'center'));
    return { nome: `RGA24_${ag.dia}`, xml: documento(b) };
  }

  function seccaoMercadoria(inst, lista) {
    const { table } = dx();
    const h = [[
      { text: 'N.º', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Passageiros Envolvidos', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Nacionalidade', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Proveniência', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'N.º do Voo', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Tipo de Mercadoria', bold: true, align: 'center', fill: 'D9D9D9' }
    ]];
    if (lista && lista.length) {
      lista.forEach((a, i) => h.push([
        { text: String(i + 1).padStart(2, '0'), align: 'center' },
        { text: a.passageiro || '' },
        { text: a.nacionalidade || '', align: 'center' },
        { text: a.origemDestino || '', align: 'center' },
        { text: a.voo || '', align: 'center' },
        { text: a.descricao || '' }
      ]));
    } else { h.push(linhaVazia(6)); }
    return table(h, { widths: [700, 2400, 1600, 1600, 1200, 2138], header: 1 });
  }

  // =========================================================================
  // RMT — Relatório mensal do lado Terra
  // =========================================================================
  function relatorioTerra(inst, ag) {
    const { p, table, porExtenso, documento } = dx();
    const fim = ultimoDia(ag.mes);
    const b = [];
    b.push.apply(b, vistoChefePosto(inst));
    b.push.apply(b, cabecalhoCentral(inst));
    b.push(dx().espaco(120));
    b.push(p(`RELATÓRIO DE ACTIVIDADES DURANTE O MÊS DE ${nomeMesAno(ag.mes).toUpperCase()}`,
      { align: 'center', bold: true, size: 12, after: 200 }));

    b.push(p(`No período compreendido entre os dias 01 à ${fim.slice(8)} de ${nomeMesAno(ag.mes)}, ` +
      `o Turno ${ag.turno || ''} efectuou o seguinte movimento:`, { align: 'both', after: 120 }));
    b.push(p(`- Chegaram ao nosso Aeroporto ${milhar(ag.voos)} Voos com ` +
      `${milhar(ag.passageiros)} passageiros;`, { after: 200 }));

    b.push(p('APREENSÕES', { bold: true, after: 60 }));
    b.push(p('Realçamos que no período em causa foram feitas as seguintes apreensões:',
      { align: 'both', after: 80 }));
    const a = ag.apreensoes;
    const totApre = a.moeda + a.diversa + a.proibida + a.dutyFree;
    b.push(tabelaContagem([
      ['01', '(Moeda)', a.moeda], ['02', 'Mercadoria Diversa', a.diversa],
      ['03', 'Mercadoria Proibida', a.proibida], ['04', 'Duty Free', a.dutyFree]
    ], totApre));

    b.push(p('SEPARADOS DE BAGAGEM', { bold: true, after: 60 }));
    b.push(p('Realçamos que no período em causa foram feitos os seguintes separados:',
      { align: 'both', after: 80 }));
    const s = ag.separados;
    const totSep = s.comercial + s.naoComercial + s.regPosterior;
    b.push(tabelaContagem([
      ['01', 'Comercial', s.comercial], ['02', 'Não Comercial', s.naoComercial],
      ['03', 'Regularização a Posterior', s.regPosterior]
    ], totSep));

    b.push(p('IMPORTAÇÕES E EXPORTAÇÕES TEMPORÁRIAS', { bold: true, after: 60 }));
    b.push(p('Registou-se ainda as seguintes importações e exportações temporárias:',
      { align: 'both', after: 80 }));
    const t = ag.temporarias;
    const totTmp = t.impTemp + t.expTemp + t.termoResp + t.termoComp;
    b.push(tabelaContagem([
      ['01', 'Importação Temporária', t.impTemp], ['02', 'Exportação Temporária', t.expTemp],
      ['04', 'Termo de Responsabilidade', t.termoResp], ['05', 'Termo de Compromisso', t.termoComp]
    ], totTmp));

    b.push(p(`${inst.cidade}, ${porExtenso(fim)}.`, { after: 200 }));
    b.push.apply(b, assinatura('O CHEFE DO TURNO', ag.chefeTurno || '', 'center'));
    b.push.apply(b, rodapeInstituicao(inst));
    return { nome: `RMT_${ag.mes}`, xml: documento(b) };
  }

  function tabelaContagem(linhas, total) {
    const { table } = dx();
    const h = [[
      { text: 'N.º', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Descrição', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Total', bold: true, align: 'center', fill: 'D9D9D9' },
      { text: 'Observação', bold: true, align: 'center', fill: 'D9D9D9' }
    ]];
    linhas.forEach((l) => h.push([
      { text: l[0], align: 'center' }, { text: l[1] },
      { text: milhar(l[2]), align: 'center' }, { text: '-', align: 'center' }
    ]));
    h.push([{ text: 'TOTAL GERAL', bold: true, colspan: 2 },
      { text: milhar(total), bold: true, align: 'center' }, { text: '-', align: 'center' }]);
    return table(h, { widths: [900, 4500, 1600, 2638], header: 1 });
  }

  // =========================================================================
  // RMA — Relatório mensal do lado Ar (grupo Scanner)
  // =========================================================================
  function relatorioAr(inst, equipa, ag) {
    const { p, table, porExtenso, documento } = dx();
    const fim = ultimoDia(ag.mes);
    const b = [];
    b.push.apply(b, vistoChefePosto(inst));
    b.push.apply(b, cabecalhoCentral(inst, [inst.sufixoAr || 'DE ICOLO E BENGO']));
    b.push(p(`Grupo Scanner – Turno - ${ag.turno || ''}`, { align: 'center', bold: true, after: 60 }));
    b.push(p(`RELATÓRIO REFERENTE AO MÊS DE ${nomeMesAno(ag.mes).toUpperCase()}`,
      { align: 'center', bold: true, size: 12, after: 160 }));

    b.push(p([{ text: 'Área de Operação: ', bold: true },
      { text: 'Aeroporto Internacional António Agostinho Neto' }], { after: 80 }));
    b.push(p([{ text: 'Nome do pessoal em serviço: ', bold: true },
      { text: (equipa || []).join(', ') + '.' }], { align: 'both', after: 80 }));
    b.push(p([{ text: 'Caso significante durante o mês: ', bold: true },
      { text: ag.casoSignificante || 'Somos a realçar que as nossas actividades foram ' +
        'realizadas nas seguintes áreas: Placa, Cabines, Contentorização.' }],
      { align: 'both', after: 200 }));

    b.push(table([
      [
        { text: 'Número de Voos Processados', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Número de Passageiros', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'N.º de Volumes Inspecionados na Contentorização', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Apreensões', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Visitas ao Catering', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Visitas a Bordo', bold: true, align: 'center', fill: 'D9D9D9' }
      ],
      [
        { text: milhar(ag.voos), align: 'center' },
        { text: milhar(ag.passageiros), align: 'center' },
        { text: milhar(ag.volumes), align: 'center' },
        { text: milhar(ag.apreensoes), align: 'center' },
        { text: milhar(ag.visitasCatering), align: 'center' },
        { text: milhar(ag.visitasBordo), align: 'center' }
      ]
    ], { header: 1 }));

    b.push(p('DADOS DA FURGONETA', { bold: true, before: 120, after: 60 }));
    const f = ag.furgoneta;
    b.push(table([
      [
        { text: 'Volumes Scaneados', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Volumes Inspecionados', bold: true, align: 'center', fill: 'D9D9D9' },
        { text: 'Apreensões', bold: true, align: 'center', fill: 'D9D9D9' }
      ],
      [
        { text: milhar(f.scaneados), align: 'center' },
        { text: milhar(f.inspecionados), align: 'center' },
        { text: milhar(f.apreensoes), align: 'center' }
      ]
    ], { header: 1 }));

    b.push(p(`Icolo e Bengo, ${porExtenso(fim)}.`, { before: 160, after: 200 }));
    b.push.apply(b, assinatura('O CHEFE DO TURNO', ag.chefeTurno || '', 'center'));
    return { nome: `RMA_${ag.mes}`, xml: documento(b) };
  }

  return {
    termoRecepcao, checklist, relatorio24, relatorioTerra, relatorioAr,
    milhar, dataCurta, ultimoDia, nomeMesAno
  };
});

</script>
  <script>
/*
 * Interface. Liga os formulários aos módulos: capta os registos de turno,
 * agrega-os nos relatórios e gera os .docx. Sem servidor: tudo no navegador.
 */
(function () {
  'use strict';
  const { docx, dados, registos, agregacao, modelos } = window.PMR;
  const JSZip = window.JSZip;
  let D = dados.carregar();

  // ---- ferramentas de DOM -------------------------------------------------
  function h(tag, attrs) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function')
        e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    for (let i = 2; i < arguments.length; i++) {
      let kids = arguments[i];
      if (!Array.isArray(kids)) kids = [kids];
      kids.forEach((kid) => {
        if (kid == null || kid === false) return;
        e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return e;
  }
  function campo(rot, input, cls) {
    return h('div', { class: 'campo ' + (cls || '') }, h('label', null, rot), input);
  }
  function inp(value, attrs) {
    return h('input', Object.assign({ value: value == null ? '' : value }, attrs || {}));
  }
  function num(value, attrs) {
    return inp(value == null ? 0 : value, Object.assign({ type: 'number', min: '0' }, attrs || {}));
  }
  function sel(valores, atual, attrs) {
    const s = h('select', attrs || {});
    valores.forEach((v) => {
      const o = h('option', { value: v }, v);
      if (v === atual) o.selected = true;
      s.append(o);
    });
    return s;
  }
  function limpar(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  async function gerar(doc) {
    await docx.baixar(JSZip, doc.xml, doc.nome);
  }

  // =======================================================================
  // Navegação
  // =======================================================================
  const PAINEIS = [
    ['registos', 'Registos de Turno'],
    ['relatorios', 'Relatórios'],
    ['trb', 'Termo de Recepção'],
    ['ckl', 'Check-list'],
    ['dados', 'Dados-mestre']
  ];
  function mostrar(id) {
    document.querySelectorAll('.painel').forEach((p) =>
      p.classList.toggle('activo', p.id === 'painel-' + id));
    document.querySelectorAll('nav button').forEach((b) =>
      b.classList.toggle('activo', b.dataset.p === id));
    const render = { registos: renderRegistos, relatorios: renderRelatorios,
      trb: renderTRB, ckl: renderCKL, dados: renderDados };
    if (render[id]) render[id]();
  }

  // =======================================================================
  // Painel: Registos de Turno
  // =======================================================================
  function renderRegistos() {
    const raiz = document.getElementById('painel-registos');
    limpar(raiz);
    raiz.append(
      h('div', { class: 'cartao' },
        h('h2', null, 'Registos de Turno'),
        h('p', { class: 'ajuda' }, 'Introduza aqui, uma vez por turno, o movimento do posto. ' +
          'É desta fonte que os relatórios saem sozinhos, sem reescrever nada.'),
        h('div', { class: 'linha-botoes' },
          h('button', { class: 'acao', onclick: () => abrirEditor(registos.novoRegisto()) },
            '+ Novo registo'))));

    const lista = registos.listar();
    const tabela = h('div', { class: 'cartao' }, h('h3', null, 'Registos guardados'));
    if (!lista.length) {
      tabela.append(h('p', { class: 'vazio' }, 'Ainda não há registos.'));
    } else {
      const t = h('table', { class: 'lista' },
        h('tr', null, h('th', null, 'Data'), h('th', null, 'Turno'), h('th', null, 'Lado'),
          h('th', null, 'Voos'), h('th', null, 'Pass.'), h('th', null, 'Apre.'),
          h('th', null, 'Bag.'), h('th', null, '')));
      lista.forEach((r) => {
        t.append(h('tr', null,
          h('td', null, r.data), h('td', null, r.turno),
          h('td', null, h('span', { class: 'pill' }, r.lado)),
          h('td', null, r.voos || 0), h('td', null, r.passageiros || 0),
          h('td', null, (r.apreensoes || []).length), h('td', null, (r.bagagens || []).length),
          h('td', null,
            h('button', { class: 'sec', onclick: () => abrirEditor(clone(r)) }, 'Abrir'),
            ' ',
            h('button', { class: 'ligereza', onclick: () => {
              if (confirm('Apagar este registo?')) { registos.apagar(r.id); renderRegistos(); }
            } }, 'Apagar'))));
      });
      tabela.append(t);
    }
    raiz.append(tabela);
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function abrirEditor(reg) {
    const raiz = document.getElementById('painel-registos');
    limpar(raiz);
    const chefes = D.chefesTurno;

    const cabec = h('div', { class: 'grelha g4' },
      campo('Data', inp(reg.data, { type: 'date', oninput: (e) => (reg.data = e.target.value) })),
      campo('Turno', sel(D.turnos, reg.turno, { oninput: (e) => (reg.turno = e.target.value) })),
      campo('Lado', sel(D.lados, reg.lado, { oninput: (e) => (reg.lado = e.target.value) })),
      campo('Chefe de Turno', chefeInput(reg)));

    const movimento = h('div', { class: 'grelha g4' },
      campo('Voos', num(reg.voos, { oninput: (e) => (reg.voos = +e.target.value) })),
      campo('Passageiros', num(reg.passageiros, { oninput: (e) => (reg.passageiros = +e.target.value) })),
      campo('Volumes (contentorização)', num(reg.volumes, { oninput: (e) => (reg.volumes = +e.target.value) })),
      campo('Visitas ao Catering', num(reg.visitasCatering, { oninput: (e) => (reg.visitasCatering = +e.target.value) })));
    const movimento2 = h('div', { class: 'grelha g4' },
      campo('Visitas a Bordo', num(reg.visitasBordo, { oninput: (e) => (reg.visitasBordo = +e.target.value) })),
      campo('Furgoneta — Scaneados', num(reg.furgoneta.scaneados, { oninput: (e) => (reg.furgoneta.scaneados = +e.target.value) })),
      campo('Furgoneta — Inspecionados', num(reg.furgoneta.inspecionados, { oninput: (e) => (reg.furgoneta.inspecionados = +e.target.value) })),
      campo('Furgoneta — Apreensões', num(reg.furgoneta.apreensoes, { oninput: (e) => (reg.furgoneta.apreensoes = +e.target.value) })));

    const sep = h('div', { class: 'grelha g3' },
      campo('Separados — Comercial', num(reg.separados.comercial, { oninput: (e) => (reg.separados.comercial = +e.target.value) })),
      campo('Separados — Não Comercial', num(reg.separados.naoComercial, { oninput: (e) => (reg.separados.naoComercial = +e.target.value) })),
      campo('Separados — Reg. a Posterior', num(reg.separados.regPosterior, { oninput: (e) => (reg.separados.regPosterior = +e.target.value) })));
    const tmp = h('div', { class: 'grelha g4' },
      campo('Importação Temporária', num(reg.temporarias.impTemp, { oninput: (e) => (reg.temporarias.impTemp = +e.target.value) })),
      campo('Exportação Temporária', num(reg.temporarias.expTemp, { oninput: (e) => (reg.temporarias.expTemp = +e.target.value) })),
      campo('Termo de Responsabilidade', num(reg.temporarias.termoResp, { oninput: (e) => (reg.temporarias.termoResp = +e.target.value) })),
      campo('Termo de Compromisso', num(reg.temporarias.termoComp, { oninput: (e) => (reg.temporarias.termoComp = +e.target.value) })));

    const caixaApre = h('div');
    const caixaBag = h('div');
    function pintarApre() {
      limpar(caixaApre);
      reg.apreensoes.forEach((a, i) => caixaApre.append(blocoApreensao(a, i, reg, pintarApre)));
    }
    function pintarBag() {
      limpar(caixaBag);
      reg.bagagens.forEach((b, i) => caixaBag.append(blocoBagagem(b, i, reg, pintarBag)));
    }
    pintarApre(); pintarBag();

    const editor = h('div', { class: 'cartao' },
      h('h2', null, 'Registo de turno'),
      cabec,
      h('h3', null, 'Movimento'), movimento, movimento2,
      h('h3', null, 'Separados de bagagem (lado Terra)'), sep,
      h('h3', null, 'Importações / Exportações temporárias (lado Terra)'), tmp,
      h('h3', null, 'Apreensões'), caixaApre,
      h('button', { class: 'sec', onclick: () => {
        reg.apreensoes.push({ tipo: D.tiposApreensao[0], passageiro: '', nacionalidade: '',
          origemDestino: '', voo: '', valor: '', descricao: '', realce: false, realceNota: '' });
        pintarApre();
      } }, '+ Apreensão'),
      h('h3', null, 'Bagagens retidas (geram Termo de Recepção)'), caixaBag,
      h('button', { class: 'sec', onclick: () => {
        reg.bagagens.push({ proveniencia: '', voo: '', dataVoo: reg.data, passageiro: '',
          etiqueta: '', companhia: '' });
        pintarBag();
      } }, '+ Bagagem'),
      h('div', { class: 'linha-botoes' },
        h('button', { class: 'acao', onclick: () => { registos.guardar(reg); renderRegistos(); } }, 'Guardar registo'),
        h('button', { class: 'sec', onclick: renderRegistos }, 'Cancelar')));
    raiz.append(editor);
  }

  function chefeInput(reg) {
    const dl = h('datalist', { id: 'chefes-dl' });
    D.chefesTurno.forEach((c) => dl.append(h('option', { value: c })));
    const i = inp(reg.chefeTurno, { list: 'chefes-dl', oninput: (e) => (reg.chefeTurno = e.target.value) });
    const wrap = h('div', null, i, dl);
    return wrap;
  }

  function blocoApreensao(a, i, reg, repinta) {
    return h('div', { class: 'sub' },
      h('button', { class: 'ligereza remover', onclick: () => { reg.apreensoes.splice(i, 1); repinta(); } }, '✕ remover'),
      h('div', { class: 'grelha g3' },
        campo('Tipo', sel(D.tiposApreensao, a.tipo, { oninput: (e) => (a.tipo = e.target.value) })),
        campo('Passageiro', inp(a.passageiro, { oninput: (e) => (a.passageiro = e.target.value) })),
        campo('Nacionalidade', inp(a.nacionalidade, { oninput: (e) => (a.nacionalidade = e.target.value) }))),
      h('div', { class: 'grelha g3' },
        campo('Proveniência / Destino', inp(a.origemDestino, { oninput: (e) => (a.origemDestino = e.target.value) })),
        campo('N.º do Voo', inp(a.voo, { oninput: (e) => (a.voo = e.target.value) })),
        campo('Valor (se moeda)', inp(a.valor, { oninput: (e) => (a.valor = e.target.value) }))),
      h('div', { class: 'grelha g2' },
        campo('Tipo de mercadoria / descrição', inp(a.descricao, { oninput: (e) => (a.descricao = e.target.value) })),
        campo('Maior realce (nota)', inp(a.realceNota, {
          oninput: (e) => { a.realceNota = e.target.value; a.realce = !!e.target.value; } }))));
  }

  function blocoBagagem(b, i, reg, repinta) {
    return h('div', { class: 'sub' },
      h('button', { class: 'ligereza remover', onclick: () => { reg.bagagens.splice(i, 1); repinta(); } }, '✕ remover'),
      h('div', { class: 'grelha g3' },
        campo('Proveniência', inp(b.proveniencia, { oninput: (e) => (b.proveniencia = e.target.value) })),
        campo('N.º do Voo', inp(b.voo, { oninput: (e) => (b.voo = e.target.value) })),
        campo('Data do Voo', inp(b.dataVoo, { type: 'date', oninput: (e) => (b.dataVoo = e.target.value) }))),
      h('div', { class: 'grelha g3' },
        campo('Passageiro', inp(b.passageiro, { oninput: (e) => (b.passageiro = e.target.value) })),
        campo('N.º de Etiqueta', inp(b.etiqueta, { oninput: (e) => (b.etiqueta = e.target.value) })),
        campo('Companhia Aérea', inp(b.companhia, { oninput: (e) => (b.companhia = e.target.value) }))),
      h('button', { class: 'sec', onclick: () => gerar(modelos.termoRecepcao(D.instituicao, {
        chefeAgt: reg.chefeTurno, chefePfa: '', companhia: b.companhia,
        dataTermo: b.dataVoo || reg.data, bagagens: [b]
      })) }, 'Gerar TRB desta bagagem'));
  }

  // =======================================================================
  // Painel: Relatórios (agregados dos registos)
  // =======================================================================
  function renderRelatorios() {
    const raiz = document.getElementById('painel-relatorios');
    limpar(raiz);
    const lista = registos.listar();
    const hoje = new Date().toISOString().slice(0, 10);
    const mesActual = hoje.slice(0, 7);

    const dataR = inp(hoje, { type: 'date' });
    const mesT = inp(mesActual, { type: 'month' });
    const mesA = inp(mesActual, { type: 'month' });

    raiz.append(
      h('div', { class: 'cartao' },
        h('h2', null, 'Relatórios automáticos'),
        h('p', { class: 'ajuda' }, 'Os relatórios são calculados a partir dos registos de turno. ' +
          'Não há nada a reescrever: escolha o período e gere.'),
        h('p', { class: 'aviso' }, `Há ${lista.length} registo(s) guardado(s) para agregar.`)),

      h('div', { class: 'cartao' },
        h('h3', null, 'RGA-24 — Relatório das últimas 24 h (gestão aeroportuária)'),
        h('div', { class: 'grelha g2' }, campo('Dia (07h → 07h do dia seguinte)', dataR)),
        h('div', { class: 'linha-botoes' },
          h('button', { class: 'acao', onclick: () =>
            gerar(modelos.relatorio24(D.instituicao, agregacao.rga24(registos.listar(), dataR.value))) },
            'Gerar RGA-24'))),

      h('div', { class: 'cartao' },
        h('h3', null, 'RMT — Relatório mensal do lado Terra'),
        h('div', { class: 'grelha g2' }, campo('Mês', mesT)),
        h('div', { class: 'linha-botoes' },
          h('button', { class: 'acao', onclick: () =>
            gerar(modelos.relatorioTerra(D.instituicao, agregacao.rmt(registos.listar(), mesT.value))) },
            'Gerar RMT'))),

      h('div', { class: 'cartao' },
        h('h3', null, 'RMA — Relatório mensal do lado Ar (grupo Scanner)'),
        h('div', { class: 'grelha g2' }, campo('Mês', mesA)),
        h('div', { class: 'linha-botoes' },
          h('button', { class: 'acao', onclick: () =>
            gerar(modelos.relatorioAr(D.instituicao, D.equipa, agregacao.rma(registos.listar(), mesA.value))) },
            'Gerar RMA'))));
  }

  // =======================================================================
  // Painel: TRB avulso
  // =======================================================================
  function renderTRB() {
    const raiz = document.getElementById('painel-trb');
    limpar(raiz);
    const b = { proveniencia: '', voo: '', dataVoo: new Date().toISOString().slice(0, 10),
      passageiro: '', etiqueta: '', companhia: '' };
    const d = { chefeAgt: '', chefePfa: '', dataTermo: new Date().toISOString().slice(0, 10) };
    raiz.append(h('div', { class: 'cartao' },
      h('h2', null, 'Termo de Recepção de Bagagens'),
      h('p', { class: 'ajuda' }, 'Emissão avulsa. Para ligar a bagagem a um turno, use antes o separador Registos.'),
      h('div', { class: 'grelha g3' },
        campo('Proveniência', inp('', { oninput: (e) => (b.proveniencia = e.target.value) })),
        campo('N.º do Voo', inp('', { oninput: (e) => (b.voo = e.target.value) })),
        campo('Data do Voo', inp(b.dataVoo, { type: 'date', oninput: (e) => (b.dataVoo = e.target.value) }))),
      h('div', { class: 'grelha g3' },
        campo('Passageiro', inp('', { oninput: (e) => (b.passageiro = e.target.value) })),
        campo('N.º de Etiqueta', inp('', { oninput: (e) => (b.etiqueta = e.target.value) })),
        campo('Companhia Aérea', inp('', { oninput: (e) => (d.companhia = e.target.value) }))),
      h('div', { class: 'grelha g3' },
        campo('Chefe de Turno AGT', inp('', { oninput: (e) => (d.chefeAgt = e.target.value) })),
        campo('Chefe de Turno PFA', inp('', { oninput: (e) => (d.chefePfa = e.target.value) })),
        campo('Data do Termo', inp(d.dataTermo, { type: 'date', oninput: (e) => (d.dataTermo = e.target.value) }))),
      h('div', { class: 'linha-botoes' },
        h('button', { class: 'acao', onclick: () =>
          gerar(modelos.termoRecepcao(D.instituicao, Object.assign({ bagagens: [b] }, d))) },
          'Gerar TRB'))));
  }

  // =======================================================================
  // Painel: CKL
  // =======================================================================
  function renderCKL() {
    const raiz = document.getElementById('painel-ckl');
    limpar(raiz);
    const dadosCkl = {
      turno: D.turnos[1], data: new Date().toISOString().slice(0, 10),
      itens: D.itensCkl.map((i) => Object.assign({ estado: 'Operacional', observacao: '' }, i)),
      ocorrencia: '', chefeEntrega: '', chefeRecebe: ''
    };
    const corpo = h('table', { class: 'lista' },
      h('tr', null, h('th', null, 'Descrição'), h('th', null, 'Qtd'),
        h('th', null, 'Estado'), h('th', null, 'Observação')));
    dadosCkl.itens.forEach((it) => {
      corpo.append(h('tr', null,
        h('td', null, it.descricao),
        h('td', null, inp(it.qtd, { style: 'width:60px', oninput: (e) => (it.qtd = e.target.value) })),
        h('td', null, sel(D.estados, it.estado, { oninput: (e) => (it.estado = e.target.value) })),
        h('td', null, inp(it.observacao, { oninput: (e) => (it.observacao = e.target.value) }))));
    });
    raiz.append(h('div', { class: 'cartao' },
      h('h2', null, 'Check-list de materiais e equipamentos'),
      h('p', { class: 'ajuda' }, 'O inventário-base já vem preenchido; só falta o estado, as observações e a ocorrência.'),
      h('div', { class: 'grelha g2' },
        campo('Turno', sel(D.turnos, dadosCkl.turno, { oninput: (e) => (dadosCkl.turno = e.target.value) })),
        campo('Data', inp(dadosCkl.data, { type: 'date', oninput: (e) => (dadosCkl.data = e.target.value) }))),
      h('h3', null, 'Itens'), corpo,
      campo('Ocorrência diária', h('textarea', { oninput: (e) => (dadosCkl.ocorrencia = e.target.value) })),
      h('div', { class: 'grelha g2' },
        campo('Chefe de Turno (entreguei)', inp('', { oninput: (e) => (dadosCkl.chefeEntrega = e.target.value) })),
        campo('Chefe de Turno (recebi)', inp('', { oninput: (e) => (dadosCkl.chefeRecebe = e.target.value) }))),
      h('div', { class: 'linha-botoes' },
        h('button', { class: 'acao', onclick: () => gerar(modelos.checklist(D.instituicao, dadosCkl)) },
          'Gerar Check-list'))));
  }

  // =======================================================================
  // Painel: Dados-mestre
  // =======================================================================
  function renderDados() {
    const raiz = document.getElementById('painel-dados');
    limpar(raiz);
    const inst = D.instituicao;
    const listaTxt = (arr) => arr.join('\n');
    const eqTA = h('textarea', { html: listaTxt(D.equipa) });
    const chTA = h('textarea', { html: listaTxt(D.chefesTurno) });
    const itTA = h('textarea', { html: D.itensCkl.map((i) => `${i.descricao} | ${i.qtd}`).join('\n') });

    function guardar() {
      inst.chefePostoCurto = qc.value; inst.cidade = qcid.value;
      inst.website = qw.value; inst.email = qe.value; inst.morada = qm.value;
      D.equipa = eqTA.value.split('\n').map((s) => s.trim()).filter(Boolean);
      D.chefesTurno = chTA.value.split('\n').map((s) => s.trim()).filter(Boolean);
      D.itensCkl = itTA.value.split('\n').map((s) => s.trim()).filter(Boolean).map((l) => {
        const [descricao, qtd] = l.split('|').map((x) => (x || '').trim());
        return { descricao, qtd: qtd || '-' };
      });
      dados.guardar(D);
      alert('Dados-mestre guardados neste navegador.');
    }

    const qc = inp(inst.chefePostoCurto);
    const qcid = inp(inst.cidade);
    const qw = inp(inst.website);
    const qe = inp(inst.email);
    const qm = inp(inst.morada);

    raiz.append(h('div', { class: 'cartao' },
      h('h2', null, 'Dados-mestre'),
      h('p', { class: 'ajuda' }, 'Valores que mudam raramente. Ficam guardados neste navegador e alimentam todos os documentos.'),
      h('div', { class: 'grelha g2' },
        campo('Chefe do Posto', qc), campo('Cidade (Terra/Luanda)', qcid)),
      h('div', { class: 'grelha g3' },
        campo('Website', qw), campo('E-mail', qe), campo('Morada (rodapé)', qm)),
      h('h3', null, 'Equipa (um nome por linha)'), eqTA,
      h('h3', null, 'Chefes de Turno (um por linha)'), chTA,
      h('h3', null, 'Itens da Check-list (descrição | quantidade)'), itTA,
      h('div', { class: 'linha-botoes' },
        h('button', { class: 'acao', onclick: guardar }, 'Guardar dados-mestre'),
        h('button', { class: 'sec', onclick: () => { D = dados.repor(); renderDados(); } }, 'Repor predefinições'))));

    raiz.append(h('div', { class: 'cartao' },
      h('h3', null, 'Cópia de segurança dos registos'),
      h('p', { class: 'ajuda' }, 'Os registos ficam neste computador. Exporte para os levar para outro, ou para guardar.'),
      h('div', { class: 'linha-botoes' },
        h('button', { class: 'sec', onclick: exportarRegistos }, 'Exportar registos (JSON)'),
        importarBotao())));
  }

  function exportarRegistos() {
    const blob = new Blob([JSON.stringify(registos.listar(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'registos-posto.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function importarBotao() {
    const f = h('input', { type: 'file', accept: '.json', style: 'display:none',
      onchange: (e) => {
        const file = e.target.files[0]; if (!file) return;
        const fr = new FileReader();
        fr.onload = () => {
          try {
            const arr = JSON.parse(fr.result);
            if (Array.isArray(arr)) { registos.gravarTodos(arr); alert(arr.length + ' registo(s) importado(s).'); }
          } catch (err) { alert('Ficheiro inválido.'); }
        };
        fr.readAsText(file);
      } });
    const b = h('button', { class: 'sec', onclick: () => f.click() }, 'Importar registos (JSON)');
    return h('span', null, b, f);
  }

  // =======================================================================
  // Arranque
  // =======================================================================
  function iniciar() {
    const nav = document.getElementById('nav');
    PAINEIS.forEach(([id, rot]) => {
      const b = h('button', { 'data-p': id, onclick: () => mostrar(id) }, rot);
      nav.append(b);
      document.querySelector('main').append(h('section', { id: 'painel-' + id, class: 'painel' }));
    });
    mostrar('registos');
  }
  document.addEventListener('DOMContentLoaded', iniciar);
})();

</script>
</body>
</html>
